name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One build at a time; a newer commit supersedes an older deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve base path
        id: base
        # A user or org site (<name>.github.io) is served from the root; every
        # other repository is served from /<repo>.
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          if [ "$repo" = "${owner}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "origin=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${repo}" >> "$GITHUB_OUTPUT"
            echo "origin=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.base.outputs.origin }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
